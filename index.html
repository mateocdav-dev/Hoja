<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2EFEA">
  <script>
    // Aplica el modo noche antes de pintar para evitar un destello claro
    try {
      var m = localStorage.getItem('hoja-mode') || 'auto';
      var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#131F24';
      }
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hoja">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <title>Hoja</title>
</head>
<body>
  <main id="app">
    <!-- INICIO -->
    <section id="view-inicio" class="view active">
      <header class="hello">
        <div>
          <p class="date" id="today"></p>
          <h1>Hola, Mateo</h1>
        </div>
        <div class="hello-actions">
        <button class="mode-btn" id="mode-btn" aria-label="Cambiar modo claro u oscuro">
          <svg class="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path class="half" d="M12 4a8 8 0 0 1 0 16Z"/></svg>
          <svg class="i-dark" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <svg class="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
        </button>
        <div class="streak" id="streak" title="Días seguidos leyendo">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 21c0-6 3-10 8-12-1 6-4 10-8 12Zm0 0c0-5-2.5-8.5-7-10 .5 5 3 8.5 7 10Z" fill="#8BA23A"/></svg>
          <span id="streak-n">0</span>
        </div>
        </div>
      </header>

      <div class="week" id="week"></div>

      <div id="continue"></div>

      <div id="nudge"></div>

      <div class="section-head">
        <h2>Biblioteca</h2>
        <span class="count" id="lib-count"></span>
      </div>
      <div class="library" id="library"></div>
    </section>

    <!-- IDEAS -->
    <section id="view-ideas" class="view">
      <header class="page-head with-menu">
        <div><h1>Ideas</h1><span class="count" id="ideas-count"></span></div>
        <button class="round-btn" id="ideas-menu-btn" aria-label="Exportar y respaldo">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </header>
      <div class="menu" id="ideas-menu" hidden>
        <button data-action="export-md">
          <b>Exportar a Obsidian</b><small>Una nota .md por libro</small>
        </button>
        <button data-action="backup">
          <b>Guardar respaldo</b><small>Ideas, avance y racha en un archivo</small>
        </button>
        <button data-action="restore">
          <b>Restaurar respaldo</b><small>Desde un archivo .json de Hoja</small>
        </button>
      </div>
      <div class="seg ideas-seg" id="ideas-seg">
        <button data-view="map">Mapa</button>
        <button data-view="cards">Tarjetas</button>
      </div>
      <div id="ideas-map" hidden><div class="graph-card ideas-graph" id="graph"></div></div>
      <div id="ideas-cards">
        <div class="filters" id="ideas-filters"></div>
        <div class="ideas" id="ideas-list"></div>
      </div>
      <input type="file" id="backup-file" accept=".json,application/json" hidden>
    </section>

    <!-- CRECER -->
    <section id="view-crecer" class="view">
      <header class="page-head"><h1>Crecer</h1></header>
      <div id="growth"></div>
      <div class="section-head"><h2>Tus datos</h2></div>
      <div class="data-card" id="data-card"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Navegación">
    <button class="tab active" data-tab="inicio">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/></svg>
      <span>Inicio</span>
    </button>
    <button class="tab" data-tab="leer">
      <svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5m0-13C14 5 17 4.5 20 5v13c-3-.5-6 0-8 1.5m0-13v13"/></svg>
      <span>Leer</span>
    </button>
    <button class="fab" id="fab" aria-label="Añadir libro">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="ideas">
      <svg viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>
      <span>Ideas</span>
    </button>
    <button class="tab" data-tab="crecer">
      <svg viewBox="0 0 24 24"><path d="M12 21v-9m0 0c0-4-3-7-7-7 0 4 3 7 7 7Zm0 0c0-4 3-7 7-7 0 4-3 7-7 7Z"/></svg>
      <span>Crecer</span>
    </button>
  </nav>

  <input type="file" id="file" accept=".epub,application/epub+zip" multiple hidden>

  <!-- LECTOR -->
  <div id="reader" class="reader t-crema" hidden>
    <header class="r-top">
      <button class="r-btn" id="r-back" aria-label="Volver">
        <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <div class="r-title"><span id="r-title"></span><svg class="ribbon" id="r-ribbon" viewBox="0 0 24 24" hidden><path d="M6 3h12v18l-6-4-6 4Z"/></svg></div>
      <button class="r-btn" id="r-nav" aria-label="Índice, marcadores y búsqueda">
        <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button class="r-btn" id="r-settings" aria-label="Ajustes de lectura"><span class="aa">Aa</span></button>
    </header>
    <div id="r-view"></div>
    <div class="r-loading" id="r-loading">Abriendo libro…</div>
    <footer class="r-bottom">
      <button class="r-arrow" id="r-prev" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <div class="r-progress">
        <div class="r-meta"><span id="r-chapter"></span><span id="r-pct">0%</span></div>
        <div class="bar"><i id="r-bar"></i></div>
      </div>
      <button class="r-arrow" id="r-next" aria-label="Página siguiente"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </footer>

    <div class="selbar" id="r-selbar" hidden>
      <button id="sel-hl"><i class="dot"></i>Resaltar</button>
      <button id="sel-note">
        <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Zm10-14 4 4"/></svg>Nota
      </button>
    </div>

    <div class="sheet-backdrop" id="r-backdrop" hidden></div>
    <div class="sheet nav-sheet" id="r-nav-sheet" hidden>
      <div class="grab"></div>
      <div class="seg" id="nav-seg">
        <button data-pane="toc" class="on">Índice</button>
        <button data-pane="marks">Marcadores</button>
        <button data-pane="search">Buscar</button>
      </div>
      <div class="nav-pane" data-pane="toc"><div class="nav-list" id="nav-toc"></div></div>
      <div class="nav-pane" data-pane="marks" hidden>
        <button class="pill wide" id="mark-toggle">Marcar esta página</button>
        <div class="nav-list" id="nav-marks"></div>
      </div>
      <div class="nav-pane" data-pane="search" hidden>
        <form id="search-form"><input id="search-q" type="search" placeholder="Buscar en el libro" enterkeyhint="search" autocomplete="off"></form>
        <p class="search-status" id="search-status"></p>
        <div class="nav-list" id="nav-results"></div>
      </div>
    </div>

    <div class="sheet" id="r-sheet" hidden>
      <div class="grab"></div>
      <div class="row">
        <span>Tamaño de letra</span>
        <div class="stepper">
          <button id="fs-down" aria-label="Letra más pequeña">A−</button>
          <b id="fs-val">100%</b>
          <button id="fs-up" aria-label="Letra más grande">A+</button>
        </div>
      </div>
      <div class="row">
        <span>Tema</span>
        <div class="swatches">
          <button data-theme="crema" class="sw sw-crema" aria-label="Crema"></button>
          <button data-theme="blanco" class="sw sw-blanco" aria-label="Blanco"></button>
          <button data-theme="noche" class="sw sw-noche" aria-label="Noche"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- DETALLE DE IDEA (en el lector y en Ideas) -->
  <div class="modal" id="idea-modal" hidden>
    <div class="modal-backdrop" id="idea-backdrop"></div>
    <div class="sheet idea-sheet">
      <div class="grab"></div>
      <p class="idea-source" id="idea-source"></p>
      <blockquote class="idea-quote-big" id="idea-quote"></blockquote>
      <textarea id="idea-note" rows="3" placeholder="¿Qué te dice esta frase? Usa #etiquetas para conectar ideas"></textarea>
      <div class="idea-actions">
        <button class="pill" id="idea-pin">
          <svg viewBox="0 0 24 24"><path d="M15 3 21 9l-4 1-4 4 1 5-2 1-4-4-4 4-1-1 4-4-4-4 1-2 5 1 4-4Z"/></svg><span>Fijar</span>
        </button>
        <button class="pill" id="idea-goto" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5m0-13C14 5 17 4.5 20 5v13c-3-.5-6 0-8 1.5m0-13v13"/></svg><span>Ir al libro</span>
        </button>
        <button class="pill danger" id="idea-delete" aria-label="Borrar">
          <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2m-7 0 1 12h8l1-12"/></svg>
        </button>
      </div>
      <button class="btn btn-green" id="idea-save">Guardar</button>
    </div>
  </div>

  <div id="ptr" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
  </div>

  <button id="update-bar" hidden>
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
    Versión nueva lista · <b>Actualizar</b>
  </button>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
